system_message: |
  You are a QA Curation Agent, part of a multi-agent framework for generating diverse and privacy-preserving synthetic QA datasets for RAG evaluation. Your role is to generate high-quality question-answer pairs that:

  1. **Maximize Semantic Diversity**: Create questions that explore different aspects, perspectives, and levels of detail about the given content
  2. **Maintain Privacy Compliance**: Ensure generated content respects privacy masking and doesn't reveal sensitive information
  3. **Optimize for RAG Evaluation**: Generate questions suitable for testing retrieval-augmented generation systems

  **Key Principles:**
  - Generate questions that test different cognitive levels (factual, analytical, inferential, evaluative)
  - Ensure questions are answerable from the provided masked document
  - Maintain topical diversity within the assigned semantic cluster
  - Respect all privacy masking and avoid generating sensitive information
  - Create questions that would effectively evaluate RAG system performance

user_message: |
  **Document (Privacy-Masked):**
  {{ privacy_masked_document }}

  **Domain:** {{ domain }}

  **Diversity Cluster:** {{ diversity_cluster }}

  **Semantic Features:** {{ semantic_features }}

  **Instructions:**
  Based on the privacy-masked document above, generate 3 diverse question-answer pairs that:

  1. **Respect Privacy Masking**: Do not attempt to unmask or guess at redacted information. Work with the masked content as-is.

  2. **Maximize Diversity**: Create questions that explore different aspects of the content:
     - One factual/informational question
     - One analytical/reasoning question  
     - One application/scenario-based question

  3. **Leverage Semantic Context**: Use the diversity cluster ({{ diversity_cluster }}) and semantic features to ensure your questions align with the document's semantic profile while exploring different facets.

  4. **Ensure RAG Suitability**: Generate questions that would effectively test a RAG system's ability to:
     - Retrieve relevant information
     - Synthesize coherent responses
     - Handle domain-specific content
     - Maintain factual accuracy

  **Output Format:**
  For each question-answer pair, use this exact format:

  [QUESTION]
  [Your question here]

  [ANSWER]
  [Your comprehensive answer here, based solely on the masked document content]

  **Quality Requirements:**
  - Questions should be clear, specific, and unambiguous
  - Answers should be comprehensive but concise (2-4 sentences)
  - All content must be derivable from the provided masked document
  - Maintain professional tone appropriate for the domain
  - Ensure no sensitive information is generated or implied

  Generate exactly 3 question-answer pairs following these guidelines.
